# Migraciones del esquema de persistencia (docs/persistencia-sqlite.md). No hay base por defecto: la ruta se indica
# siempre y debe estar fuera del repositorio.
#   .venv\Scripts\alembic -x base=C:\ruta\real-jaen.sqlite upgrade head
# Las importaciones de datos son otros comandos; estas revisiones solo cambian el esquema.

[alembic]
script_location = %(here)s/persistencia/migraciones
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

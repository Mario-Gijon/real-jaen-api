# Explicit isolated test stack. Never merge this file with the habitual Compose.
services:
  profile-admin:
    profiles: [simulated]
    image: ${RJ_SIM_ACQUISITION_IMAGE:?Set a local test acquisition image}
    pull_policy: never
    entrypoint: [python, -B, -m, acquisition.admin]
    init: true
    network_mode: none
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./seccomp-linux-amd64.json"]
    volumes: ["profiles:/profiles"]
  acquisition:
    profiles: [simulated]
    image: ${RJ_SIM_ACQUISITION_IMAGE:?Set a local test acquisition image}
    pull_policy: never
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./seccomp-linux-amd64.json"]
    environment:
      ACQ_TEST_MODE: ${RJ_ENABLE_SIMULATED:?Set explicitly to 1 only for isolated test deployment}
      ACQ_PROVIDER: simulated-local-v1
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - profiles:/profiles
      - jobs:/acquisition-jobs
      - type: bind
        source: ${RJ_SIM_SECRET_FILE:?Set temporary secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [isolated]
  backend-client:
    profiles: [simulated]
    image: ${RJ_SIM_BACKEND_IMAGE:?Set a local test backend image}
    pull_policy: never
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - state:/state
      - type: bind
        source: ${RJ_SIM_SECRET_FILE:?Set temporary secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
    networks: [isolated]
networks:
  isolated: {internal: true}
volumes:
  profiles:
    external: true
    name: ${RJ_SIM_PROFILE_VOLUME:?New exclusive test volume required}
  jobs:
    external: true
    name: ${RJ_SIM_JOBS_VOLUME:?New exclusive test volume required}
  state:
    external: true
    name: ${RJ_SIM_STATE_VOLUME:?New exclusive test volume required}

# Explicit isolated test stack of the acquisition service. Never merge this file with the habitual Compose.
# Internal network without egress. The acquisition service replays recorded responses from a local site inside its
# own container (provider fixture-site, test image only); the backend client works on a copy of an inactive snapshot.
services:
  profile-admin:
    image: ${RJ_TEST_ACQUISITION_IMAGE:?Set a local test acquisition image}
    pull_policy: never
    entrypoint: [python, -B, -m, acquisition.admin]
    init: true
    network_mode: none
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./seccomp-linux-amd64.json"]
    shm_size: 512m
    volumes: ["profiles:/profiles"]
  acquisition:
    image: ${RJ_TEST_ACQUISITION_IMAGE:?Set a local test acquisition image}
    pull_policy: never
    entrypoint: [python, -B, -m, acquisition.service]
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "seccomp=./seccomp-linux-amd64.json"]
    shm_size: 512m
    mem_limit: 2g
    pids_limit: 512
    environment:
      ACQ_TEST_MODE: ${RJ_TEST_MODE:?Set explicitly to 1 only for the isolated test stack}
      ACQ_PROVIDER: fixture-site
      ACQ_FIXTURE_ROUTES: /fixtures/routes.json
      ACQ_FIXTURE_SCENARIO: ${RJ_TEST_SCENARIO:-challenge}
      # Group recipe tests only: simulated time of the plan and the transport, and a smaller planned budget.
      ACQ_TEST_NOW: ${RJ_TEST_NOW:-}
      ACQ_TEST_PLANNED_ATTEMPTS: ${RJ_TEST_PLANNED_ATTEMPTS:-}
      ACQ_SECRET_FILE: /run/secrets/acquisition-token
    volumes:
      - profiles:/profiles
      - jobs:/acquisition-jobs
      - type: bind
        source: ${RJ_TEST_SECRET_FILE:?Set temporary secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_TEST_ROUTES:?Set the recorded routes file}
        target: /fixtures/routes.json
        read_only: true
        bind: {create_host_path: false}
    networks: [control]
  backend-client:
    image: ${RJ_TEST_BACKEND_IMAGE:?Set a local test backend image}
    pull_policy: never
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - state:/state
      - type: bind
        source: ${RJ_TEST_SECRET_FILE:?Set temporary secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_TEST_SNAPSHOT:?Set an identified inactive snapshot}
        target: /imports/snapshot.sqlite
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: evidence
        target: /evidence
        read_only: true
    networks: [control]
  # Update validation (test_updates.py): the backend in control mode over the same isolated copy, the only service
  # published, on loopback, for a Next production server on the host. Test installation only (modo prueba).
  backend-control:
    profiles: [updates]
    image: ${RJ_TEST_BACKEND_IMAGE:?Set a local test backend image}
    pull_policy: never
    entrypoint: [python, -B, /app/control.py]
    command: [--base, /state/base.sqlite, --ambito, /app/ambito.json, --host, 0.0.0.0, --port, "8001"]
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RJ_ACQUISITION_TEST: "1"
      RJ_UPDATE_RECIPE: ${RJ_TEST_RECIPE:-sofascore-pilot-16599363-v1}
      RJ_ACQUISITION_URL: http://acquisition:8002
      RJ_ACQUISITION_SECRET_FILE: /run/secrets/acquisition-token
      RJ_CONTROL_SECRET_FILE: /run/secrets/control-token
    volumes:
      - state:/state
      - type: bind
        source: ${RJ_TEST_SECRET_FILE:?Set temporary secret file outside code and images}
        target: /run/secrets/acquisition-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RJ_TEST_CONTROL_SECRET_FILE:-/nonexistent-control-secret}
        target: /run/secrets/control-token
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:${RJ_TEST_CONTROL_PORT:-18001}:8001"]
    networks: [control, published]
networks:
  control: {internal: true}
  published: {}
volumes:
  profiles:
    external: true
    name: ${RJ_TEST_PROFILE_VOLUME:?New exclusive test volume required}
  jobs:
    external: true
    name: ${RJ_TEST_JOBS_VOLUME:?New exclusive test volume required}
  state:
    external: true
    name: ${RJ_TEST_STATE_VOLUME:?New exclusive test volume required}
  evidence:
    external: true
    name: ${RJ_TEST_EVIDENCE_VOLUME:?Exchange volume of the real run, mounted read-only}
